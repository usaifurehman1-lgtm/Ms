<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chat Media Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #0b141a;
    color: white;
    font-family: Arial, sans-serif;
}

/* CHAT MEDIA CONTAINER */

#chatMediaContainer {
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 10px;
}

/* CHAT MEDIA THUMBNAILS */

.chat-media {
    width: 220px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #111b21;
    position: relative;
    cursor: pointer;
}

.chat-media img,
.chat-media video {
    width: 100%;
    display: block;
    max-height: 300px;
    object-fit: cover;
}

.video-thumb {
    position: relative;
}

.video-thumb::after {
    content: "▶";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #0009;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    pointer-events: none;
}

.media-label {
    padding: 8px;
    font-size: 12px;
    color: #cbd5db;
}

/* FULL SCREEN VIEWER */

#mediaViewer {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    display: none;
    flex-direction: column;
}

#mediaViewer.show {
    display: flex;
}

.viewer-header {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #111;
    flex-shrink: 0;
}

.viewer-title {
    font-size: 14px;
    color: white;
}

.viewer-close {
    background: transparent;
    border: 0;
    color: white;
    font-size: 28px;
    padding: 5px 12px;
}

.viewer-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
}

#viewerContent {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
}

#viewerContent img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    transition: transform 0.15s ease;
}

#viewerContent video {
    width: 100%;
    height: 100%;
    max-height: 100%;
    background: #000;
    object-fit: contain;
}

.viewer-footer {
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 10px;
    background: #111;
    flex-shrink: 0;
}

.viewer-btn {
    background: #26343c;
    border: 0;
    border-radius: 9px;
    color: white;
    padding: 12px 18px;
    font-size: 15px;
}

.viewer-counter {
    color: #aaa;
    font-size: 13px;
}

.viewer-error {
    color: #ff7777;
    padding: 20px;
    text-align: center;
}

@media(max-width:480px) {
    .chat-media {
        width: 190px;
    }

    .viewer-header {
        height: 50px;
    }
}
</style>
</head>

<body>

<!-- CHAT MEDIA CONTAINER -->

<div id="chatMediaContainer"></div>

<!-- FULL SCREEN MEDIA VIEWER -->

<div id="mediaViewer">

    <div class="viewer-header">

        <div class="viewer-title" id="viewerTitle">
            Media
        </div>

        <button class="viewer-close"
                onclick="closeMediaViewer()">
            ✕
        </button>

    </div>

    <div class="viewer-stage" id="viewerStage">

        <div id="viewerContent"></div>

    </div>

    <div class="viewer-footer">

        <button class="viewer-btn"
                onclick="previousMedia()">
            ◀
        </button>

        <span class="viewer-counter" id="viewerCounter">
            0/0
        </span>

        <button class="viewer-btn"
                onclick="nextMedia()">
            ▶
        </button>

    </div>

</div>

<script>
"use strict";

/* MEDIA LIST */

let chatMediaList = [];

let viewerIndex = 0;
let viewerOpen = false;
let zoomScale = 1;

let touchStartX = 0;
let touchStartY = 0;


/* ADD MEDIA */

function addChatMedia(url, type, name) {

    if (!url || !type) {
        return false;
    }

    if (type !== "image" && type !== "video") {
        return false;
    }

    chatMediaList.push({
        url: url,
        type: type,
        name: name || (type === "image" ? "Photo" : "Video")
    });

    renderChatMedia();

    return true;
}


/* RENDER CHAT MEDIA */

function renderChatMedia() {

    const container = document.getElementById("chatMediaContainer");

    if (!container) {
        return;
    }

    container.replaceChildren();

    chatMediaList.forEach((media, index) => {

        const card = document.createElement("div");

        card.className = "chat-media";
        card.dataset.mediaIndex = index;

        card.addEventListener("click", () => {
            openMediaGallery(index);
        });

        if (media.type === "image") {

            const img = document.createElement("img");

            img.src = media.url;
            img.alt = media.name;
            img.loading = "lazy";

            card.appendChild(img);

        } else {

            card.classList.add("video-thumb");

            const video = document.createElement("video");

            video.src = media.url;
            video.muted = true;
            video.preload = "metadata";
            video.playsInline = true;

            card.appendChild(video);
        }

        const label = document.createElement("div");

        label.className = "media-label";
        label.textContent = media.type === "image" ? "📷 Photo" : "🎬 Video";

        card.appendChild(label);

        container.appendChild(card);
    });
}


/* OPEN FULL SCREEN VIEWER */

function openMediaGallery(index) {

    if (!chatMediaList.length) {
        return;
    }

    if (index < 0 || index >= chatMediaList.length) {
        return;
    }

    viewerIndex = index;
    viewerOpen = true;
    zoomScale = 1;

    document.getElementById("mediaViewer").classList.add("show");

    document.body.style.overflow = "hidden";

    renderViewerMedia();
}


/* SHOW MEDIA */

function renderViewerMedia() {

    if (!viewerOpen) {
        return;
    }

    const media = chatMediaList[viewerIndex];

    if (!media) {
        return;
    }

    const content = document.getElementById("viewerContent");

    content.replaceChildren();
    content.className = "";

    zoomScale = 1;

    document.getElementById("viewerTitle").textContent = media.name;

    document.getElementById("viewerCounter").textContent =
        (viewerIndex + 1) + "/" + chatMediaList.length;

    if (media.type === "image") {

        const img = document.createElement("img");

        img.src = media.url;
        img.alt = media.name;

        img.onload = () => {
            zoomScale = 1;
            img.style.transform = "scale(1)";
        };

        img.onerror = () => {

            content.className = "viewer-error";
            content.textContent = "Photo नहीं खुल सकी।";

        };

        img.addEventListener("click", toggleImageZoom);

        content.appendChild(img);

    } else if (media.type === "video") {

        const video = document.createElement("video");

        video.src = media.url;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = "auto";

        video.onerror = () => {

            content.className = "viewer-error";
            content.textContent = "Video नहीं चल सकी।";

        };

        content.appendChild(video);

        video.play().catch(() => {});
    }
}


/* IMAGE ZOOM */

function toggleImageZoom(event) {

    const img = event.currentTarget;

    zoomScale = zoomScale === 1 ? 2 : 1;

    img.style.transform = "scale(" + zoomScale + ")";
}


/* STOP CURRENT VIDEO */

function stopCurrentVideo() {

    const content = document.getElementById("viewerContent");

    const video = content.querySelector("video");

    if (video) {

        video.pause();
        video.removeAttribute("src");
        video.load();

    }
}


/* PREVIOUS MEDIA */

function previousMedia() {

    if (!viewerOpen || !chatMediaList.length) {
        return;
    }

    stopCurrentVideo();

    viewerIndex =
        (viewerIndex - 1 + chatMediaList.length) % chatMediaList.length;

    renderViewerMedia();
}


/* NEXT MEDIA */

function nextMedia() {

    if (!viewerOpen || !chatMediaList.length) {
        return;
    }

    stopCurrentVideo();

    viewerIndex =
        (viewerIndex + 1) % chatMediaList.length;

    renderViewerMedia();
}


/* CLOSE VIEWER */

function closeMediaViewer() {

    if (!viewerOpen) {
        return;
    }

    stopCurrentVideo();

    viewerOpen = false;

    const content = document.getElementById("viewerContent");

    content.replaceChildren();
    content.className = "";

    document.getElementById("mediaViewer").classList.remove("show");

    document.body.style.overflow = "";

    zoomScale = 1;
}


/* SWIPE SUPPORT */

const stage = document.getElementById("viewerStage");

stage.addEventListener("touchstart", event => {

    if (event.touches.length === 1) {

        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;

    }

}, { passive: true });


stage.addEventListener("touchend", event => {

    if (!viewerOpen || !event.changedTouches.length) {
        return;
    }

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const dx = endX - touchStartX;
    const dy = endY - touchStartY;

    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {

        if (dx < 0) {
            nextMedia();
        } else {
            previousMedia();
        }
    }

}, { passive: true });


/* KEYBOARD SUPPORT */

document.addEventListener("keydown", event => {

    if (!viewerOpen) {
        return;
    }

    if (event.key === "Escape") {
        closeMediaViewer();
    }

    if (event.key === "ArrowRight") {
        nextMedia();
    }

    if (event.key === "ArrowLeft") {
        previousMedia();
    }

});


/* SAMPLE MEDIA */

addChatMedia("sample-photo.jpg", "image", "Photo");

addChatMedia("sample-video.mp4", "video", "Video");

</script>

</body>
</html>
